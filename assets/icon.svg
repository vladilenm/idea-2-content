<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="synapse" x1="128" y1="96" x2="384" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Фон graphite.950 -->
  <rect width="512" height="512" fill="#07070b"/>
  <rect width="512" height="512" fill="url(#halo)"/>

  <!-- Синаптические связи -->
  <g stroke="url(#synapse)" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="256" x2="146" y2="150"/>
    <line x1="256" y1="256" x2="372" y2="158"/>
    <line x1="256" y1="256" x2="150" y2="366"/>
    <line x1="256" y1="256" x2="366" y2="362"/>
    <line x1="256" y1="256" x2="256" y2="118"/>
    <line x1="256" y1="256" x2="256" y2="394"/>
  </g>

  <!-- Внешние узлы -->
  <g fill="url(#synapse)">
    <circle cx="146" cy="150" r="26"/>
    <circle cx="372" cy="158" r="26"/>
    <circle cx="150" cy="366" r="26"/>
    <circle cx="366" cy="362" r="26"/>
    <circle cx="256" cy="118" r="22"/>
    <circle cx="256" cy="394" r="22"/>
  </g>

  <!-- Центральный узел -->
  <circle cx="256" cy="256" r="58" fill="#0c0c12" stroke="url(#synapse)" stroke-width="16"/>
  <circle cx="256" cy="256" r="24" fill="url(#synapse)"/>
</svg>
